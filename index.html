<title>متابعة الصلاحية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column built for a phone at the shelf. Status banner first, filter chips, add form, then the list sorted by nearest expiry. */
:root {
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --bg: #f2f5f1;
  --surface: #ffffff;
  --fg: #17211d;
  --muted: #596760;
  --line: #d9e0da;
  --accent: #0e6b57;
  --accent-fg: #ffffff;
  --red: #a8231b;      --red-bg: #fbe8e5;
  --orange: #a74a07;   --orange-bg: #fdecd9;
  --amber: #7d6200;    --amber-bg: #faf1c7;
  --ok: #1d6638;       --ok-bg: #e1f2e6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613; --surface: #17211b; --fg: #e8efe9; --muted: #9aa9a1; --line: #27352c;
    --accent: #4cc2a3; --accent-fg: #06241c;
    --red: #ff9a90; --red-bg: #3b201d;
    --orange: #ffb877; --orange-bg: #3b2815;
    --amber: #ecd36e; --amber-bg: #353010;
    --ok: #86d9a0; --ok-bg: #1a3324;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613; --surface: #17211b; --fg: #e8efe9; --muted: #9aa9a1; --line: #27352c;
  --accent: #4cc2a3; --accent-fg: #06241c;
  --red: #ff9a90; --red-bg: #3b201d;
  --orange: #ffb877; --orange-bg: #3b2815;
  --amber: #ecd36e; --amber-bg: #353010;
  --ok: #86d9a0; --ok-bg: #1a3324;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; direction: rtl; }
.app {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
header { display: flex; flex-direction: column; gap: 2px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1.3; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.banner { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--ok-bg); color: var(--ok); }
.banner.s-expired { background: var(--red-bg); color: var(--red); }
.banner.s-d5 { background: var(--orange-bg); color: var(--orange); }
.banner.s-d10 { background: var(--amber-bg); color: var(--amber); }
.banner strong { font-family: var(--font-display); font-size: 1.1rem; font-weight: 800; }
.banner p { margin: 0; font-size: 0.95rem; }
.banner button { align-self: flex-start; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 0.9rem; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip .n { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
form.add { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 0; }
.field.wide { flex-basis: 100%; }
label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }
input, textarea, select { font: inherit; font-size: 16px; min-height: 46px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
input[type="date"] { text-align: right; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { font: inherit; font-weight: 600; min-height: 46px; padding: 8px 22px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; flex: 1 1 100%; }
button.ghost { font: inherit; font-size: 0.9rem; min-height: 40px; padding: 6px 14px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.err { color: var(--red); font-size: 0.85rem; margin: 0; flex-basis: 100%; }

.cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.cats .chip { flex: 0 0 auto; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2px var(--surface); }
.dot.s-d5 { background: var(--orange); } .dot.s-d10 { background: var(--amber); }
.list li.sechead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--bg); font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
.list li.sechead .c { font-family: var(--font-body); font-weight: 500; font-size: 0.82rem; color: var(--muted); }
#listwrap { overflow: hidden; }
.searchrow { display: flex; }
ul.list { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.name { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; min-width: 0; }
.tag { font-size: 0.75rem; font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-inline-start: 8px; white-space: nowrap; }
.meta { grid-column: 1; color: var(--muted); font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.pill { font-size: 0.85rem; font-weight: 600; padding: 3px 12px; border-radius: 999px; white-space: nowrap; background: var(--ok-bg); color: var(--ok); }
.pill.s-expired { background: var(--red-bg); color: var(--red); }
.pill.s-d5 { background: var(--orange-bg); color: var(--orange); }
.pill.s-d10 { background: var(--amber-bg); color: var(--amber); }
.stage { grid-column: 1; font-size: 0.82rem; font-weight: 500; }
.stage.s-expired { color: var(--red); } .stage.s-d5 { color: var(--orange); } .stage.s-d10 { color: var(--amber); }
.del { grid-column: 2; grid-row: 2 / span 2; justify-self: end; font: inherit; font-size: 0.85rem; min-height: 40px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.del.armed { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

details.backup { padding: 14px 16px; }
details.backup summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.backup .inner { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.backup p { margin: 0; color: var(--muted); font-size: 0.88rem; }
.backup textarea { min-height: 90px; font-size: 14px; direction: ltr; text-align: left; }
.backup .row { display: flex; flex-wrap: wrap; gap: 8px; }
.backup .row button { flex: 1 1 140px; }
#msg { min-height: 1.4em; font-size: 0.88rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) { .chip, button { transition: background-color .15s, border-color .15s; } }
</style>
<script>document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";</script>

<div class="app">
  <header>
    <h1>متابعة الصلاحية</h1>
    <p class="sub num" id="today"></p>
  </header>

  <section class="banner" id="banner" aria-live="polite"></section>

  <div class="cats" id="cats" role="group" aria-label="الأقسام"></div>

  <div class="chips" id="chips" role="group" aria-label="تصفية حسب الحالة"></div>

  <form class="panel add" id="form" novalidate>
    <div class="field wide">
      <label for="name">اسم المادة</label>
      <input id="name" type="text" autocomplete="off" placeholder="مثال: حليب كامل الدسم 1 لتر">
    </div>
    <div class="field">
      <label for="exp">تاريخ الانتهاء</label>
      <input id="exp" type="date">
    </div>
    <div class="field">
      <label for="qty">الكمية أو الرف (اختياري)</label>
      <input id="qty" type="text" autocomplete="off" placeholder="مثال: 12 علبة، رف 3">
    </div>
    <div class="field wide">
      <label for="cat">القسم</label>
      <select id="cat"></select>
    </div>
    <p class="err" id="err" hidden></p>
    <button class="primary" type="submit">إضافة المادة</button>
  </form>

  <div class="searchrow">
    <input id="q" type="search" placeholder="بحث باسم المادة" aria-label="بحث باسم المادة">
  </div>

  <div class="panel" id="listwrap"><ul class="list" id="list"></ul></div>

  <details class="panel backup">
    <summary>نسخة احتياطية</summary>
    <div class="inner">
      <p>القائمة تنحفظ داخل متصفح هذا الجهاز فقط. انسخها واحتفظ بها، أو الصقها هنا لاسترجاعها على جهاز ثاني.</p>
      <textarea id="bk" aria-label="بيانات النسخة الاحتياطية" spellcheck="false"></textarea>
      <div class="row">
        <button class="ghost" type="button" id="copy">نسخ القائمة</button>
        <button class="ghost" type="button" id="restore">استرجاع من النص</button>
      </div>
      <p id="msg" aria-live="polite"></p>
    </div>
  </details>
</div>

<script>
(function () {
  var KEY = "expiry-tracker-v1";
  var $ = function (id) { return document.getElementById(id); };
  var CATS = [
    ["dairy", "الألبان"],
    ["meat", "اللحوم"],
    ["cheese", "الأجبان والنساتل والحلويات"],
    ["soda", "المشروبات الغازية"],
    ["juice", "العصائر"],
    ["canned", "المعلبات والمواد الجافة"],
    ["other", "أخرى"]
  ];
  var CAT_IDS = CATS.map(function (c) { return c[0]; });
  function catName(id) { return CATS[Math.max(0, CAT_IDS.indexOf(id))][1]; }
  var SAMPLE_CATS = { "لبن رائب 500 غم": "dairy", "جبن كريمي": "cheese", "عصير برتقال 1 لتر": "juice", "معكرونة 400 غم": "canned" };
  function fixCat(it) {
    if (CAT_IDS.indexOf(it.cat) === -1) it.cat = (it.sample && SAMPLE_CATS[it.name]) || "other";
    return it;
  }
  var items = [], filter = "all", catFilter = "all", query = "", armedId = null, armTimer = null;

  function pad(n) { return String(n).padStart(2, "0"); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysLeft(s) { return Math.round((parse(s) - today()) / 86400000); }
  function fmt(s) { var p = s.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
  function cnt(a) { return a === 1 ? "يوم" : a === 2 ? "يومين" : a <= 10 ? a + " أيام" : a + " يوم"; }
  function status(n) { return n < 0 ? "expired" : n <= 5 ? "d5" : n <= 10 ? "d10" : "ok"; }
  function phrase(n) { return n < 0 ? "منتهي منذ " + cnt(-n) : n === 0 ? "ينتهي اليوم" : "باقي " + cnt(n); }
  function stageText(s) {
    return s === "expired" ? "انتهت الصلاحية، اسحبها من الرف"
         : s === "d5" ? "التنبيه الثاني: أقل من 5 أيام"
         : s === "d10" ? "التنبيه الأول: أقل من 10 أيام" : "";
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function load() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) { var d = JSON.parse(r); if (d && Array.isArray(d.items)) return d.items.map(fixCat); }
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: items })); } catch (e) {} }

  function seed() {
    var t = today();
    function at(off) { var d = new Date(t); d.setDate(d.getDate() + off); return ymd(d); }
    return [
      { id: uid(), name: "لبن رائب 500 غم", exp: at(-2), qty: "6 علب", cat: "dairy", sample: true },
      { id: uid(), name: "جبن كريمي", exp: at(3), qty: "رف 2", cat: "cheese", sample: true },
      { id: uid(), name: "عصير برتقال 1 لتر", exp: at(8), qty: "12 علبة", cat: "juice", sample: true },
      { id: uid(), name: "معكرونة 400 غم", exp: at(45), qty: "", cat: "canned", sample: true }
    ];
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function counts(cat) {
    var c = { all: 0, expired: 0, d5: 0, d10: 0, ok: 0 };
    items.forEach(function (it) {
      if (cat && cat !== "all" && it.cat !== cat) return;
      c.all++; c[status(daysLeft(it.exp))]++;
    });
    return c;
  }

  function renderCats() {
    var wrap = $("cats");
    wrap.textContent = "";
    [["all", "كل الأقسام"]].concat(CATS).forEach(function (x) {
      var c = counts(x[0]);
      var b = el("button", "chip");
      b.type = "button";
      b.setAttribute("aria-pressed", catFilter === x[0] ? "true" : "false");
      b.appendChild(el("span", null, x[1]));
      b.appendChild(el("span", "n", String(c.all)));
      var worst = c.expired ? "expired" : c.d5 ? "d5" : c.d10 ? "d10" : "";
      if (worst) { var dt = el("span", "dot s-" + worst); dt.setAttribute("aria-hidden", "true"); b.appendChild(dt); }
      b.addEventListener("click", function () {
        catFilter = x[0];
        if (x[0] !== "all") $("cat").value = x[0];
        render();
      });
      wrap.appendChild(b);
    });
  }

  function renderBanner(c) {
    var b = $("banner");
    b.textContent = "";
    var worst = c.expired ? "expired" : c.d5 ? "d5" : c.d10 ? "d10" : "ok";
    b.className = "banner" + (worst === "ok" ? "" : " s-" + worst);
    if (worst === "ok") {
      b.appendChild(el("strong", null, "ما كو مواد قريبة من الانتهاء اليوم"));
    } else {
      b.appendChild(el("strong", null, "تنبيه اليوم"));
      var parts = [];
      if (c.expired) parts.push(c.expired + " منتهية الصلاحية، تُسحب");
      if (c.d5) parts.push(c.d5 + " باقي لها 5 أيام أو أقل (التنبيه الثاني)");
      if (c.d10) parts.push(c.d10 + " باقي لها من 6 إلى 10 أيام (التنبيه الأول)");
      parts.forEach(function (t) { b.appendChild(el("p", "num", t)); });
    }
    if (items.some(function (i) { return i.sample; })) {
      b.appendChild(el("p", null, "المواد المعلّمة «مثال» هي للتجربة فقط."));
      var btn = el("button", "ghost", "مسح الأمثلة");
      btn.type = "button";
      btn.addEventListener("click", function () {
        items = items.filter(function (i) { return !i.sample; });
        save(); render();
      });
      b.appendChild(btn);
    }
  }

  function renderChips(c) {
    var wrap = $("chips");
    wrap.textContent = "";
    [["all", "الكل", c.all], ["expired", "منتهية", c.expired], ["d5", "خلال 5 أيام", c.d5], ["d10", "من 6 إلى 10 أيام", c.d10]].forEach(function (x) {
      var b = el("button", "chip");
      b.type = "button";
      b.setAttribute("aria-pressed", filter === x[0] ? "true" : "false");
      b.appendChild(el("span", null, x[1]));
      b.appendChild(el("span", "n", String(x[2])));
      b.addEventListener("click", function () { filter = x[0]; render(); });
      wrap.appendChild(b);
    });
  }

  function renderList() {
    var ul = $("list");
    ul.textContent = "";
    var rows = items.slice().sort(function (a, b) {
        var ca = CAT_IDS.indexOf(a.cat), cb = CAT_IDS.indexOf(b.cat);
        if (ca !== cb) return ca - cb;
        return a.exp < b.exp ? -1 : a.exp > b.exp ? 1 : 0;
      })
      .filter(function (it) {
        var s = status(daysLeft(it.exp));
        if (catFilter !== "all" && it.cat !== catFilter) return false;
        if (filter !== "all" && s !== filter) return false;
        if (query && it.name.toLowerCase().indexOf(query.toLowerCase()) === -1) return false;
        return true;
      });
    if (!rows.length) {
      var li = el("li", "empty", items.length ? "ما كو مواد بهذا التصفية." : "القائمة فارغة. أضف أول مادة من النموذج فوق.");
      li.style.display = "block";
      ul.appendChild(li);
      return;
    }
    var lastCat = null;
    rows.forEach(function (it) {
      var n = daysLeft(it.exp), s = status(n);
      if (it.cat !== lastCat) {
        lastCat = it.cat;
        var total = rows.filter(function (r) { return r.cat === it.cat; }).length;
        var h = el("li", "sechead");
        h.appendChild(el("span", null, catName(it.cat)));
        h.appendChild(el("span", "c num", total + " مادة"));
        ul.appendChild(h);
      }
      var li = el("li");
      var nm = el("div", "name", it.name);
      if (it.sample) nm.appendChild(el("span", "tag", "مثال"));
      li.appendChild(nm);
      li.appendChild(el("span", "pill num s-" + s, phrase(n)));
      var meta = "ينتهي " + fmt(it.exp) + (it.qty ? " · " + it.qty : "");
      li.appendChild(el("div", "meta num", meta));
      var st = stageText(s);
      if (st) li.appendChild(el("div", "stage s-" + s, st));
      var d = el("button", "del" + (armedId === it.id ? " armed" : ""), armedId === it.id ? "تأكيد الحذف" : "حذف");
      d.type = "button";
      d.addEventListener("click", function () {
        if (armedId === it.id) {
          items = items.filter(function (x) { return x.id !== it.id; });
          armedId = null; save(); render();
        } else {
          armedId = it.id; render();
          clearTimeout(armTimer);
          armTimer = setTimeout(function () { armedId = null; render(); }, 3500);
        }
      });
      li.appendChild(d);
      ul.appendChild(li);
    });
  }

  function render() {
    var t = today();
    $("today").textContent = "اليوم " + fmt(ymd(t));
    renderBanner(counts()); renderCats(); renderChips(counts(catFilter)); renderList();
  }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("name").value.trim(), exp = $("exp").value, qty = $("qty").value.trim();
    var err = $("err");
    if (!name) { err.textContent = "اكتب اسم المادة."; err.hidden = false; $("name").focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(exp)) { err.textContent = "اختر تاريخ الانتهاء."; err.hidden = false; $("exp").focus(); return; }
    err.hidden = true;
    var cat = $("cat").value;
    items.push({ id: uid(), name: name, exp: exp, qty: qty, cat: cat });
    save();
    $("name").value = ""; $("qty").value = ""; $("exp").value = "";
    filter = "all";
    if (catFilter !== "all") catFilter = cat;
    render();
    $("name").focus();
  });

  $("q").addEventListener("input", function (e) { query = e.target.value.trim(); renderList(); });

  function say(t) { $("msg").textContent = t; }
  $("copy").addEventListener("click", function () {
    var json = JSON.stringify(items.filter(function (i) { return !i.sample; }));
    var ta = $("bk");
    ta.value = json;
    var done = function () { say("اننسخت القائمة. احتفظ بها في ملاحظات أو رسالة لنفسك."); };
    var fail = function () { ta.focus(); ta.select(); say("حدد النص وانسخه يدويا."); };
    try { navigator.clipboard.writeText(json).then(done, fail); } catch (e) { fail(); }
  });
  $("restore").addEventListener("click", function () {
    try {
      var d = JSON.parse($("bk").value);
      if (!Array.isArray(d)) throw 0;
      var ok = d.filter(function (x) { return x && typeof x.name === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x.exp); })
        .map(function (x) { return { id: uid(), name: x.name, exp: x.exp, qty: typeof x.qty === "string" ? x.qty : "", cat: CAT_IDS.indexOf(x.cat) > -1 ? x.cat : "other" }; });
      if (!ok.length) throw 0;
      items = items.filter(function (i) { return !i.sample; }).concat(ok);
      save(); render(); say("انسترجعت " + ok.length + " مادة.");
    } catch (e) { say("النص غير صالح. الصق النص المنسوخ كما هو."); }
  });

  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  CATS.forEach(function (c) {
    var o = document.createElement("option");
    o.value = c[0]; o.textContent = c[1];
    $("cat").appendChild(o);
  });
  var saved = load();
  items = saved === null ? seed() : saved;
  if (saved === null) save();

})();
